<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Restablecer Contraseña</title>
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
  <header>…</header>
  <div class="container">
    <h2>Restablecer Contraseña</h2>
    <form id="reset-form">
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" required>
      <label for="confirm">Confirmar contraseña</label>
      <input type="password" id="confirm" required>
      <button type="submit">Restablecer</button>
    </form>
    <p id="msg"></p>
  </div>
  <script>
    // Extrae token de la query string
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pwd = e.target.password.value;
      const conf = e.target.confirm.value;
      if (pwd !== conf) return document.getElementById('msg').textContent = 'Las contraseñas no coinciden';
      const res = await fetch('/api/auth/reset-password', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, password: pwd })
      });
      const data = await res.json();
      document.getElementById('msg').textContent = data.msg || data.error;
    });
  </script>
</body>
</html>
