<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer Contraseña</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1 class="auth-card__title">Restablecer Contraseña</h1>
      <p class="auth-card__subtitle">
        Introduce tu nueva contraseña para completar el restablecimiento.
      </p>

      <form id="reset-form" class="auth-form">
        <div class="auth-form__group">
          <label for="password" class="auth-form__label">Nueva contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="auth-form__input"
            placeholder="•••••••••"
            minlength="6"
            required
          >
        </div>
        <div class="auth-form__group">
          <label for="confirm" class="auth-form__label">Confirmar contraseña</label>
          <input
            type="password"
            id="confirm"
            name="confirm"
            class="auth-form__input"
            placeholder="•••••••••"
            minlength="6"
            required
          >
        </div>
        <button type="submit" class="auth-form__button">Restablecer</button>
      </form>

      <p id="msg" class="auth-form__msg"></p>
      <p class="auth-card__link">
        <a href="/login">← Volver al inicio de sesión</a>
      </p>
    </div>
  </main>

  <script>
    // Extraer token de la query string
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    console.log('Token de restablecimiento:', token);

    const form = document.getElementById('reset-form');
    const msgEl = document.getElementById('msg');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const password = document.getElementById('password').value.trim();
      const confirm  = document.getElementById('confirm').value.trim();

      if (password !== confirm) {
        msgEl.textContent = 'Las contraseñas no coinciden';
        msgEl.classList.add('auth-form__msg--visible');
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        console.log('Respuesta reset:', data);
        msgEl.textContent = data.message || data.msg || data.error;
        msgEl.classList.add('auth-form__msg--visible');
        if (res.ok) {
          setTimeout(() => window.location.href = '/login', 2000);
        }
      } catch (error) {
        console.error('Error en fetch reset:', error);
        msgEl.textContent = 'Ocurrió un error, inténtalo más tarde';
        msgEl.classList.add('auth-form__msg--visible');
      }
    });
  </script>
</body>
</html>
